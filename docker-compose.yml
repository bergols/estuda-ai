services:
  db:
    # Postgres 16 com a extensão pgvector já compilada.
    # A extensão ainda precisa ser habilitada por banco (CREATE EXTENSION),
    # o que a migration inicial faz.
    image: pgvector/pgvector:pg16
    # O Docker dá só 64 MB de /dev/shm. O Postgres usa memória compartilhada para
    # operações paralelas (ex.: CREATE INDEX hnsw com vários workers) e falha com
    # "could not resize shared memory segment" sem isto.
    shm_size: 1gb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Volume nomeado: os dados sobrevivem a `docker compose down`
      # (só somem com `docker compose down -v`).
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready responde só quando o servidor aceita conexões
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        # Espera o healthcheck passar, não só o container iniciar
        condition: service_healthy
    environment:
      # Cache do Hugging Face num volume: o modelo (~470 MB) baixa uma vez só
      HF_HOME: /modelos
      UPLOAD_DIR: /data/uploads
      # No Colima/macOS os eventos de arquivo não atravessam o virtiofs: sem polling,
      # o --reload do uvicorn não percebe as edições.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      # Código montado para desenvolvimento: editar no Mac reflete no container
      - ./backend:/app
      # PDFs enviados. O banco guarda só metadados + caminho (ver docs/busca-semantica.md)
      - uploads:/data/uploads
      - modelos:/modelos
      # docs/ montada para scripts/experimento_hnsw.py gravar os resultados no repositório
      - ./docs:/docs
    # Migrations (como dono) -> login/senha do papel da app -> API (como estuda_ai_app)
    command: sh -c "alembic upgrade head && python -m scripts.papel_app && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
  uploads:
  modelos:
