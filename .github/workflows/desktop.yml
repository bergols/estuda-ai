# Instaladores do app desktop (Tauri): macOS (.dmg universal) e Windows (.msi e .exe).
#
# NÃO roda a cada push, de propósito. O repositório é privado, e no plano grátis do
# GitHub um minuto de runner macOS conta como 10 e um de Windows como 2, dentro de
# 2.000 minutos por mês. Um build universal do Mac leva ~15 min (~150 da cota).
# A cada push, o ci.yml já testa o núcleo em Linux (barato) e o build estático.
#
# Como disparar:
#   - Release:  git tag desktop-v0.1.0 && git push origin desktop-v0.1.0
#     (a tag precisa bater com "version" em desktop/src-tauri/tauri.conf.json) → os
#     builds geram os instaladores e o job "release" cria uma Release em RASCUNHO com
#     eles; você confere e publica.
#   - Só testar o build: aba Actions → "Desktop" → "Run workflow" → os instaladores
#     ficam como artefatos da execução (sem Release).
name: Desktop

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

# Os builds só leem o repositório; quem escreve (cria a Release) é o job "release".
permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instaladores:
    strategy:
      fail-fast: false # um sistema falhar não cancela o outro
      matrix:
        include:
          # Um .dmg "universal": binário com as duas arquiteturas (Apple Silicon e Intel)
          - sistema: macos-latest
            alvos: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - sistema: windows-latest
            alvos: ""
            args: ""
    runs-on: ${{ matrix.sistema }}
    timeout-minutes: 45

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Servidor que o app usa. Vazio = o padrão do código (a Vercel de produção).
      # Para trocar sem mexer no código: Settings → Secrets and variables → Actions →
      # Variables → ESTUDA_AI_URL. É endereço público, não segredo.
      ESTUDA_AI_URL: ${{ vars.ESTUDA_AI_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.alvos }}

      # Guarda o target/ compilado entre execuções (o Tauri tem ~400 crates)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target

      - name: Tag confere com a versão do app
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          versao=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          if [ "desktop-v$versao" != "$GITHUB_REF_NAME" ]; then
            echo "::error::a tag $GITHUB_REF_NAME não bate com a versão $versao do tauri.conf.json"
            exit 1
          fi

      - name: Dependências
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop

      # Os testes rodam no próprio sistema: o que depende de Windows/macOS (arquivo
      # hosts, processos, nas próximas etapas) só é testado de verdade aqui.
      - name: Testes Rust
        working-directory: desktop
        run: cargo test --workspace

      # Só build + artefatos. A Release é criada UMA vez, no job abaixo: na primeira
      # versão, cada sistema tentava criar a sua (corrida entre os dois) e o tauri-action
      # recebeu 403 do GitHub mesmo com contents: write (ver docs/modo-foco.md, seção 5).
      - name: Build e instaladores
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # só leitura neste job
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true

  release:
    needs: instaladores
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04 # 1 min de Linux, em vez de repetir em cada sistema
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artefatos

      - name: Release em rascunho com os instaladores e o SHA-256 de cada um
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir instaladores
          find artefatos -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) \
            -exec cp {} instaladores/ \;
          cd instaladores
          ls -la
          {
            echo "Instaladores sem assinatura de código paga. Na primeira vez, o macOS"
            echo "(Gatekeeper) e o Windows (SmartScreen) avisam: como abrir em"
            echo "docs/modo-foco.md, seção 6. No Windows, prefira o -setup.exe."
            echo
            echo "SHA-256:"
            echo '```'
            sha256sum *
            echo '```'
          } > ../notas.md
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --draft \
              --verify-tag --title "estuda-ai ${GITHUB_REF_NAME#desktop-v}" --notes-file ../notas.md
          fi
