# Instaladores do app desktop (Tauri): macOS (.dmg universal) e Windows (.msi e .exe).
#
# NÃO roda a cada push, de propósito. O repositório é privado, e no plano grátis do
# GitHub um minuto de runner macOS conta como 10 e um de Windows como 2, dentro de
# 2.000 minutos por mês. Um build universal do Mac leva ~15 min (~150 da cota).
# A cada push, o ci.yml já testa o núcleo em Linux (barato) e o build estático.
#
# Como disparar:
#   - Release:  git tag desktop-v0.1.0 && git push origin desktop-v0.1.0
#     (a tag precisa bater com "version" em desktop/src-tauri/tauri.conf.json) → cria
#     uma Release em RASCUNHO com os instaladores; você confere e publica.
#   - Só testar o build: aba Actions → "Desktop" → "Run workflow" → os instaladores
#     ficam como artefatos da execução (sem Release).
name: Desktop

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

# Criar a Release e subir os arquivos exige escrita no repositório (só neste workflow).
permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instaladores:
    strategy:
      fail-fast: false # um sistema falhar não cancela o outro
      matrix:
        include:
          # Um .dmg "universal": binário com as duas arquiteturas (Apple Silicon e Intel)
          - sistema: macos-latest
            alvos: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - sistema: windows-latest
            alvos: ""
            args: ""
    runs-on: ${{ matrix.sistema }}
    timeout-minutes: 45

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Servidor que o app usa. Vazio = o padrão do código (a Vercel de produção).
      # Para trocar sem mexer no código: Settings → Secrets and variables → Actions →
      # Variables → ESTUDA_AI_URL. É endereço público, não segredo.
      ESTUDA_AI_URL: ${{ vars.ESTUDA_AI_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.alvos }}

      # Guarda o target/ compilado entre execuções (o Tauri tem ~400 crates)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target

      - name: Tag confere com a versão do app
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          versao=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          if [ "desktop-v$versao" != "$GITHUB_REF_NAME" ]; then
            echo "::error::a tag $GITHUB_REF_NAME não bate com a versão $versao do tauri.conf.json"
            exit 1
          fi

      - name: Dependências
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop

      # Os testes rodam no próprio sistema: o que depende de Windows/macOS (arquivo
      # hosts, processos, nas próximas etapas) só é testado de verdade aqui.
      - name: Testes Rust
        working-directory: desktop
        run: cargo test --workspace

      - name: Build e instaladores
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          # Com tag: cria/atualiza a Release em rascunho. Sem tag: só artefatos.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('estuda-ai {0}', github.ref_name) || '' }}
          releaseBody: >-
            Instaladores sem assinatura de código paga. Na primeira vez, o Windows
            (SmartScreen) e o macOS (Gatekeeper) avisam: veja como abrir em
            docs/modo-foco.md, seção "Instalar sem assinatura".
          releaseDraft: true
          uploadWorkflowArtifacts: true
