[project]
name = "estuda-ai-backend"
version = "0.1.0"
description = "API do estuda-ai: assistente de estudos com RAG e repetição espaçada"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "pgvector>=0.3",
    "pymupdf>=1.24",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "python-multipart>=0.0.9",
    "anthropic>=1.0",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Testes com o modelo real de embeddings são lentos: rode com `pytest -m modelo`.
addopts = "-ra -m 'not modelo'"
markers = ["modelo: usa o modelo real de embeddings (baixa ~470 MB na 1a vez)"]
filterwarnings = [
    # Ruído do SWIG usado internamente pelo PyMuPDF
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]

[tool.uv]
package = false

# No Linux (container), o torch do PyPI pode trazer bibliotecas CUDA (GBs).
# Este índice oficial do PyTorch só tem builds para CPU; no macOS vale o PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
