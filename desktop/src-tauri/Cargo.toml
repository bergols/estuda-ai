[package]
name = "estuda-ai"
version = "0.4.0"
description = "estuda-ai: app desktop (Windows e macOS)"
edition.workspace = true
license.workspace = true
publish = false

[lib]
# Nome da biblioteca diferente do binário (exigência do Tauri v2 por causa do Windows)
name = "estuda_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nucleo = { path = "../nucleo" }
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json"] }
# Cofre do sistema: Keychain (macOS), Gerenciador de Credenciais (Windows)
keyring = "4"
url = "2"
# Laço de sincronização: espera com timeout e "acordar" (Notify)
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-opener = "2"
gethostname = "1"
getrandom = "0.3"
tauri-plugin-updater = "2"
# Monitor de processos do modo foco (só a parte de processos, sem discos/rede/sensores)
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[dev-dependencies]
mockito = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
